<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/main.css">

        <style>
            .big{
                width: 100%;
                height: 100%;
                display: block;
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
            }
        </style>
    </head>

    <body>
        <div class="big"/>

        <a class="btn" onclick="if(history.length > 1) {history.back(); }else {window.location.href='/';} return false;" style="float:right;">
            Back
        </a>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const slug = document.location.href.split("/").pop();
                const el = document.getElementsByClassName("big")[0];
                if(slug){
                    Object.assign(el.style, {
                        backgroundImage: `url(/explore/links/${slug}.png)`
                    });
                }
            });
        </script>

    </body>


</html>
