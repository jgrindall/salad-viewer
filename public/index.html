<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/main.css">

        <style>
            
            .monster{
                width: 220px;
                height: 283px;
                background-image: url('level6.png');
                background-position: 0 0;
                background-size: 600% 100%;
            }
            
            .activities{
                margin:10px;
                padding:10px;
            }
            ul.activities-list{
                margin:10px;
                padding:10px;
            }
        </style>
        <script src="/utils.js"></script>
    </head>

    <body>
        <h1>
            This is the home page
        </h1>
        <div class="monster">
        </div>

        <div class="container">
            <div class="activities">
                <p>
                    Available activities:
                </p>
                <ul class="activities-list">
                </ul>
            </div>
        </div>

        <a class="btn" href="/admin" style="float:right;">
            Admin
        </a>
        
    </body>

    

    <script>
        

        const listActivities = async ()=>{
            const activities = await window.saladUtils.listActivities();
            const container = document.querySelector("ul.activities-list");
            if( activities.length === 0){
                container.innerHTML = "<span>None found</span>";
                return;
            }
            activities.forEach((a)=>{
                const activity = document.createElement("li");
                const id = a.match(/^activity-(.*)\.json$/)[1];
                console.log(id);
                activity.innerHTML = `
<a href='/view/${id}'>
    <p>${a}</p>
</a>
`;
                container.appendChild(activity);
            })
        }

        listActivities();

        

    </script>
</html>
