<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <link rel="stylesheet" href="/main.css">
        <link rel="stylesheet" href="/lib/salad.bundled.css">

        <script src="/lib/salad.bundled.js"></script>
        <script src="/lib/api.js"></script>
        <script src="/utils.js"></script>

        <style>
            html, body{
                padding:0;
                margin:0;
            }

            #salad_container{
                width: 100%;
                height: 100%;
            }
            .top{
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 10000000000000;
                > {
                    padding:8px;
                    margin:8px;
                }
            }

        </style>

    </head>
    <body>
        <div class="top">
            <a class="btn" href="/" style="float:right;">
                Home
            </a>
        </div>
        
        <div id="salad_container">
        </div>


        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                const activityId = window.location.pathname.split('/').pop();
                
                const {
                    assetMap,
                    data,
                    script,
                    pages,
                    fonts
                } =  await window.saladUtils.getActivityData(activityId);
                
                const container = document.getElementById("salad_container");
                const api = window.getApi(assetMap);
                
                Salad.Factory.createActivity({
                    mode: "play",
                    container,
                    script,
                    data,
                    api,
                    fonts,
                    pages
                });
            });
        </script>


    </body>
</html>
